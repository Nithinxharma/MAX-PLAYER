name: CI/CD Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Sign APKs
        run: |
          set -e
          RELEASE_DIR="app/build/outputs/apk/release"

          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "Using repository SIGNING_KEYSTORE secret..."
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
            KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
            STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No SIGNING_KEYSTORE secret configured. Generating a temporary debug keystore..."
            keytool -genkey -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
            KEY_ALIAS="androiddebugkey"
            STORE_PASS="android"
            KEY_PASS="android"
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          find "$RELEASE_DIR" -name "app-*-release-unsigned.apk" -o -name "app-release-unsigned.apk" | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
            echo "Signing $apk -> $signed_apk"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$signed_apk" \
              "$apk"

            "$APKSIGNER" verify "$signed_apk"
          done

          rm -f release.keystore
          ls -lh "$RELEASE_DIR"/*.apk

      - name: Upload app-arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-STREAM-arm64-v8a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload app-armeabi-v7a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-STREAM-armeabi-v7a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk

      - name: Upload app-universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-STREAM-universal-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload app-x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-STREAM-x86-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-x86-release.apk

      - name: Upload app-x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-STREAM-x86_64-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/app-x86_64-release.apk
