name: CI/CD Debug Build (No R8)

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring google-services.json from secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "app/google-services.json exists."
          else
            echo "Warning: google-services.json missing, relying on Gradle fallback generator."
          fi

      - name: Restore & Ensure Static Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring static debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -in debug.keystore.base64 -out debug.keystore 2>/dev/null || true
          fi

          if [ ! -s "debug.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            echo "Copying from ~/.android/debug.keystore..."
            cp "$HOME/.android/debug.keystore" debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating static debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore" 2>/dev/null || true
          ls -lh debug.keystore

      - name: Build Debug APK with Gradle (No R8)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC\" -Dfile.encoding=UTF-8"
        run: ./gradlew assembleDebug

      - name: Locate Debug APKs
        run: |
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAX-STREAM-debug-apk-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
