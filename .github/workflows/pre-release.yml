name: Make Pre release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*-preview.[0-9]+'

jobs:
  release-for-github:
    name: "Preview Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring google-services.json from secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "app/google-services.json exists."
          else
            echo "Warning: google-services.json missing, relying on Gradle fallback generator."
          fi

      - name: Restore & Ensure Static Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring static debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -in debug.keystore.base64 -out debug.keystore 2>/dev/null || true
          fi

          if [ ! -s "debug.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            echo "Copying from ~/.android/debug.keystore..."
            cp "$HOME/.android/debug.keystore" debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating static debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore" 2>/dev/null || true
          ls -lh debug.keystore

      - name: Build preview APKs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC\" -Dfile.encoding=UTF-8"
        run: ./gradlew assemblePreview --stacktrace

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          PREVIEW_DIR="app/build/outputs/apk/preview"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$PREVIEW_DIR"

      - name: Sign APKs
        run: |
          set -e
          PREVIEW_DIR="app/build/outputs/apk/preview"
          
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "Using repository SIGNING_KEYSTORE secret..."
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore 2>/dev/null || base64 --decode > release.keystore
            KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
            STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No SIGNING_KEYSTORE secret configured. Falling back to static debug.keystore..."
            if [ -s "debug.keystore" ]; then
              cp debug.keystore release.keystore
            elif [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > release.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > release.keystore 2>/dev/null || true
            fi

            if [ ! -s "release.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
              cp "$HOME/.android/debug.keystore" release.keystore
            fi

            if [ ! -s "release.keystore" ]; then
              keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            KEY_ALIAS="androiddebugkey"
            STORE_PASS="android"
            KEY_PASS="android"
          fi
          
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          APK_COUNT=$(find "$PREVIEW_DIR" -name "app-*-preview.apk" -type f | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No preview APK files found"
            ls -lah "$PREVIEW_DIR"
            rm -f release.keystore
            exit 1
          fi
          
          find "$PREVIEW_DIR" -name "app-*-preview.apk" -type f | while read -r apk; do
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              "$apk"
            "$APKSIGNER" verify "$apk"
          done
          
          rm -f release.keystore
          ls -lh "$PREVIEW_DIR"/app-*-preview.apk

      - name: Copy built artifacts
        run: |
          set -e
          mkdir -p preview
          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")

          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            dest="preview/MAX-STREAM-preview-${abi}-${{ env.VERSION_TAG }}.apk"
            if [ -f "$src" ]; then
              cp "$src" "$dest"
              sha=$(sha256sum "$dest" | awk '{ print $1 }')
              echo "apk-${abi}-sha256=$sha" >> $GITHUB_ENV
            fi
          done

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "MAX STREAM ${{ env.VERSION_TAG }}"
          body: |
            
            ### Checksums
            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk-arm64-v8a-sha256 }} |
            | armeabi-v7a | ${{ env.apk-armeabi-v7a-sha256 }} |
            | Universal | ${{ env.apk-universal-sha256 }} |
            | x86 | ${{ env.apk-x86-sha256 }} |
            | x86_64 | ${{ env.apk-x86_64-sha256 }} |
          files: |
            preview/MAX-STREAM-preview-universal-${{ env.VERSION_TAG }}.apk
            preview/MAX-STREAM-preview-arm64-v8a-${{ env.VERSION_TAG }}.apk
            preview/MAX-STREAM-preview-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            preview/MAX-STREAM-preview-x86-${{ env.VERSION_TAG }}.apk
            preview/MAX-STREAM-preview-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
