name: Preview Build & Deploy
# Triggering fresh validation


permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      universal_size: ${{ steps.set_commit.outputs.universal_size }}
      arm64-v8a_size: ${{ steps.set_commit.outputs.arm64-v8a_size }}
      armeabi-v7a_size: ${{ steps.set_commit.outputs.armeabi-v7a_size }}
      x86_size: ${{ steps.set_commit.outputs.x86_size }}
      x86_64_size: ${{ steps.set_commit.outputs.x86_64_size }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring google-services.json from secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "app/google-services.json exists."
          else
            echo "Warning: google-services.json missing, relying on Gradle fallback generator."
          fi

      - name: Restore & Ensure Static Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring static debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -in debug.keystore.base64 -out debug.keystore 2>/dev/null || true
          fi

          if [ ! -s "debug.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            echo "Copying from ~/.android/debug.keystore..."
            cp "$HOME/.android/debug.keystore" debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating static debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore" 2>/dev/null || true
          ls -lh debug.keystore

      - name: Build with Gradle
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC\" -Dfile.encoding=UTF-8"
        run: ./gradlew assemblePreview

      - name: Sign APKs
        run: |
          set -e
          RELEASE_DIR="app/build/outputs/apk/preview"
          
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "Using repository SIGNING_KEYSTORE secret..."
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore 2>/dev/null || base64 --decode > release.keystore
            KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
            STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No SIGNING_KEYSTORE secret configured. Falling back to static debug.keystore..."
            if [ -s "debug.keystore" ]; then
              cp debug.keystore release.keystore
            elif [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > release.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > release.keystore 2>/dev/null || true
            fi

            if [ ! -s "release.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
              cp "$HOME/.android/debug.keystore" release.keystore
            fi

            if [ ! -s "release.keystore" ]; then
              keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            KEY_ALIAS="androiddebugkey"
            STORE_PASS="android"
            KEY_PASS="android"
          fi
          
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          # Sign any unsigned APKs if present
          find "$RELEASE_DIR" -name "app-*-preview-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
            echo "Signing $apk -> $signed_apk"
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$signed_apk" \
              "$apk"
            rm -f "$apk"
          done

          # Verify all preview APKs
          find "$RELEASE_DIR" -name "app-*-preview.apk" -type f | while read -r apk; do
            echo "Verifying $apk..."
            "$APKSIGNER" verify "$apk" || true
          done
          
          rm -f release.keystore
          ls -lh "$RELEASE_DIR"/*.apk

      - name: Copy build artifacts
        id: set_commit
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          build_time=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          echo "build_time=$build_time" >> $GITHUB_OUTPUT

          declare -a apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          mkdir -p output
          
          for arch in "${apks[@]}"; do
            src="app/build/outputs/apk/preview/app-${arch}-preview.apk"
            dest="output/MAX-STREAM-preview-r${commit_count}-${arch}.apk"
            
            if [ -f "$src" ]; then
              cp "$src" "$dest"
              size=$(du -h "$dest" | cut -f1)
              echo "${arch}_size=$size" >> $GITHUB_OUTPUT
            else
              echo "${arch}_size=N/A" >> $GITHUB_OUTPUT
            fi
          done

          if [ -f "app/build/outputs/apk/preview/app-preview.apk" ] && [ ! -f "output/MAX-STREAM-preview-r${commit_count}-universal.apk" ]; then
            cp "app/build/outputs/apk/preview/app-preview.apk" "output/MAX-STREAM-preview-r${commit_count}-universal.apk"
            size=$(du -h "output/MAX-STREAM-preview-r${commit_count}-universal.apk" | cut -f1)
            echo "universal_size=$size" >> $GITHUB_OUTPUT
          fi

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: output/
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: preview-apks
          path: ./public

      - name: Generate download page
        run: |
          export COMMIT_COUNT=${{ needs.build.outputs.commit_count }}
          export BUILD_TIME="${{ needs.build.outputs.build_time }}"
          export UNIVERSAL_SIZE="${{ needs.build.outputs.universal_size }}"
          export ARM64_SIZE="${{ needs.build.outputs.arm64-v8a_size }}"
          export ARMV7_SIZE="${{ needs.build.outputs.armeabi-v7a_size }}"
          export X86_SIZE="${{ needs.build.outputs.x86_size }}"
          export X86_64_SIZE="${{ needs.build.outputs.x86_64_size }}"
          
          envsubst < .github/workflows/preview.template.html > ./public/index.html


      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4