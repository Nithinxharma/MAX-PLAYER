name: Make release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring google-services.json from secret..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "app/google-services.json exists."
          else
            echo "Warning: google-services.json missing, relying on Gradle fallback generator."
          fi

      - name: Restore Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring release keystore from KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/maxstream-release.jks 2>/dev/null || base64 --decode > app/maxstream-release.jks 2>/dev/null || true
          elif [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "Restoring release keystore from SIGNING_KEYSTORE..."
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > app/maxstream-release.jks 2>/dev/null || base64 --decode > app/maxstream-release.jks 2>/dev/null || true
          fi

      - name: Verify Keystore
        run: ls -la app/

      - name: Restore & Ensure Static Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring static debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -in debug.keystore.base64 -out debug.keystore 2>/dev/null || true
          fi

          if [ ! -s "debug.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            echo "Copying from ~/.android/debug.keystore..."
            cp "$HOME/.android/debug.keystore" debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating static debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore" 2>/dev/null || true
          ls -lh debug.keystore

      - name: Build release with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC\" -Dfile.encoding=UTF-8"
        run: ./gradlew verifyReleaseSigning firebaseReleaseReadinessCheck assembleRelease --stacktrace

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION_TAG=$(basename $GITHUB_REF)" >> $GITHUB_ENV

      - name: Verify build output
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          ls -lah "$RELEASE_DIR"

      - name: Sign APKs
        run: |
          set -e
          RELEASE_DIR="app/build/outputs/apk/release"
          
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "Using repository SIGNING_KEYSTORE secret..."
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore 2>/dev/null || base64 --decode > release.keystore
            KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
            STORE_PASS="${{ secrets.SIGNING_STORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No SIGNING_KEYSTORE secret configured. Falling back to static debug.keystore..."
            if [ -s "debug.keystore" ]; then
              cp debug.keystore release.keystore
            elif [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > release.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > release.keystore 2>/dev/null || true
            fi

            if [ ! -s "release.keystore" ] && [ -f "$HOME/.android/debug.keystore" ]; then
              cp "$HOME/.android/debug.keystore" release.keystore
            fi

            if [ ! -s "release.keystore" ]; then
              keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            KEY_ALIAS="androiddebugkey"
            STORE_PASS="android"
            KEY_PASS="android"
          fi
          
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          APK_COUNT=$(find "$RELEASE_DIR" -name "app-*-release-unsigned.apk" -type f | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No unsigned APK files found"
            ls -lah "$RELEASE_DIR"
            rm -f release.keystore
            exit 1
          fi
          
          find "$RELEASE_DIR" -name "app-*-release-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"
          
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$signed_apk" \
              "$apk"
          
            "$APKSIGNER" verify "$signed_apk"
            rm "$apk"
          done
          
          rm -f release.keystore
          ls -lh "$RELEASE_DIR"/app-*-release.apk

      - name: Copy build artifacts
        run: |
          set -euo pipefail
          apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            dst="MAX-STREAM-${abi}-${VERSION_TAG}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed APK for $abi was not found"
              exit 1
            fi
            cp "$src" "$dst"
            checksum=$(sha256sum "$dst" | awk '{ print $1 }')
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$checksum" >> "$GITHUB_ENV"
          done
          
          ls -lah MAX-STREAM-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: MAX STREAM ${{ env.VERSION_TAG }}
          body: |
            ---
            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk_arm64_v8a_sha256 }} |
            | armeabi-v7a | ${{ env.apk_armeabi_v7a_sha256 }} |
            | Universal | ${{ env.apk_universal_sha256 }} |
            | x86 | ${{ env.apk_x86_sha256 }} |
            | x86_64 | ${{ env.apk_x86_64_sha256 }} |
          files: |
            MAX-STREAM-universal-${{ env.VERSION_TAG }}.apk
            MAX-STREAM-arm64-v8a-${{ env.VERSION_TAG }}.apk
            MAX-STREAM-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            MAX-STREAM-x86-${{ env.VERSION_TAG }}.apk
            MAX-STREAM-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
